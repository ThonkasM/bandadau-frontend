appId: com.bandadau.app
name: UC-02 · Iniciar sesión y renovar sesión
---
- launchApp:
    clearState: true
- assertVisible: 'Bienvenido a Bandada U'
- tapOn: 'Iniciar sesión'
- assertVisible: 'Correo institucional'
- tapOn: 'Correo institucional'
- inputText: '${EMAIL}'
- tapOn: 'Contraseña'
- inputText: '${PASSWORD}'
- tapOn: 'Entrar'
# Sesión creada; el layout autenticado monta la barra de pestañas.
- assertVisible: 'Feed'
- assertVisible: 'Eventos'
